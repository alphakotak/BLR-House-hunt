name: Flat-hunt digest

on:
  schedule:
    # Roughly every 10 hours (UTC). GitHub does not guarantee exact timing.
    - cron: "0 */10 * * *"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

concurrency:
  group: flathunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tests (matcher logic)
        run: PYTHONPATH=src pytest -q

      # Persist the "already seen" store between runs so you are not
      # re-emailed the same post. Best-effort; a cache miss just means a
      # slightly fuller first digest.
      - name: Restore seen store
        uses: actions/cache/restore@v4
        with:
          path: data/seen.json
          key: flathunt-seen-${{ github.run_id }}
          restore-keys: flathunt-seen-

      - name: Decode Facebook session
        env:
          FB_STORAGE_STATE_B64: ${{ secrets.FB_STORAGE_STATE_B64 }}
        run: |
          mkdir -p data
          if [ -z "$FB_STORAGE_STATE_B64" ]; then
            echo "::error::FB_STORAGE_STATE_B64 secret is not set. See README."
            exit 1
          fi
          echo "$FB_STORAGE_STATE_B64" | base64 -d > data/fb_state.json

      - name: Run flat-hunt
        env:
          PYTHONPATH: src
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FB_STORAGE_STATE_PATH: data/fb_state.json
          HEADLESS: "1"
        run: python -m flathunt.run

      - name: Save seen store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen.json
          key: flathunt-seen-${{ github.run_id }}
